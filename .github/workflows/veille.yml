name: veille

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: veille
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le dépôt de données (privé)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/donnees-eure-27
          token: ${{ secrets.DATA_TOKEN }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Veille
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATA_DIR: data
        run: python veille.py

      - name: Enregistrer l'historique
        run: |
          cd data
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "maj $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
