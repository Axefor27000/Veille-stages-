name: keepalive

# GitHub désactive les planifications d'un dépôt public sans activité depuis 60 jours.
# Ce petit commit mensuel évite l'arrêt silencieux de la veille.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          date -u +%F > .keepalive
          git add .keepalive
          git commit -m "keepalive" || exit 0
          git push
